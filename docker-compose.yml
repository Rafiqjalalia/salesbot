version: '3.8'

services:
  whatsflow:
    build: .
    container_name: whatsflow
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
      - MONGODB_URI=mongodb://mongo:27017/whatsflow
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./wdata:/app/backend/.wdata
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: whatsflow-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
